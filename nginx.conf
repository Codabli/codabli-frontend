# Sert la SPA Angular. Le routage /api et /auth est géré en amont par Caddy ;
# ici on ne fait que servir les fichiers statiques avec fallback SPA.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Routes Angular : toute URL inconnue renvoie index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets fingerprintés.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
