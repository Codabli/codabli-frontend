<button
  type="button"
  [style.position]="'absolute'"
  [style.left.%]="x()"
  [style.top.%]="y()"
  [attr.aria-expanded]="isOpen()"
  [attr.aria-controls]="isOpen() ? detailsId() : null"
  (click)="toggle()"
>
  {{ 'artGallery.hotspot.label' | translate: { id: hotspotId() } }}
</button>

@if (isOpen()) {
  <div class="hotspot-popup-backdrop" (click)="close()">
    <section
      class="hotspot-popup"
      [id]="detailsId()"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="'artGallery.hotspot.label' | translate: { id: hotspotId() }"
      (click)="$event.stopPropagation()"
    >
      <button
        class="hotspot-popup__close"
        type="button"
        [attr.aria-label]="'modal.close' | translate"
        (click)="close()"
      >
        &times;
      </button>
      <img class="hotspot-popup__image" [src]="imageUrl()" alt="" />
      <p class="hotspot-popup__text">{{ text() }}</p>
    </section>
  </div>
}
