<section class="shop" id="boutique" aria-labelledby="shop-title">
  <div class="shop__heading">
    <h2 id="shop-title">Visitez également notre boutique</h2>
    <p>Vous pouvez acheter sans vous abonner</p>
  </div>

  <div
    #shopTrack
    class="shop__track"
    role="region"
    aria-label="Articles de la boutique"
    tabindex="0"
    (scroll)="onProductsScroll()"
    (scrollend)="onProductsScrollEnd()"
  >
    @for (product of carouselProducts; track $index) {
      <article
        class="shop-card"
        [class.shop-card--side]="isSideProduct($index)"
        [attr.aria-hidden]="
          $index < originalProductCount || $index >= originalProductCount * 2
            ? 'true'
            : null
        "
        [attr.inert]="
          $index < originalProductCount || $index >= originalProductCount * 2
            ? ''
            : null
        "
      >
        <img
          class="shop-card__image"
          [src]="product.image"
          [alt]="product.imageAlt"
          width="288"
          height="219"
          loading="lazy"
        />
        <div class="shop-card__details">
          <h3>{{ product.name }}</h3>
          <p class="shop-card__price">{{ product.price }} €</p>
          <div class="shop-card__actions">
            <button
              class="shop-card__action shop-card__action--view"
              type="button"
            >
              Consulter
            </button>
            <button
              class="shop-card__action shop-card__action--adopt"
              type="button"
            >
              Adopter ce conte
            </button>
          </div>
        </div>
      </article>
    }
  </div>

  <div
    class="shop__controls"
    role="group"
    aria-label="Navigation des articles de la boutique"
  >
    <app-button
      class="shop__control"
      variant="tertiary"
      carouselIcon="left"
      ariaLabel="Article précédent"
      (click)="scrollProducts(-1)"
    />
    <app-button
      class="shop__control"
      variant="tertiary"
      carouselIcon="right"
      ariaLabel="Article suivant"
      (click)="scrollProducts(1)"
    />
  </div>
</section>
