<section
  class="subscriptions"
  id="abonnements"
  aria-labelledby="subscriptions-title"
>
  <h2 id="subscriptions-title">Nos abonnements</h2>

  <div class="subscriptions__grid">
    @for (plan of plans; track plan.name) {
      <article
        class="plan-card"
        [class.plan-card--yellow]="plan.accent === 'yellow'"
        [class.plan-card--pink]="plan.accent === 'pink'"
        [class.plan-card--blue]="plan.accent === 'blue'"
      >
        <h3>{{ plan.name }}</h3>
        <span class="plan-card__accent" aria-hidden="true"></span>
        <p class="plan-card__price">
          <span class="plan-card__amount">{{ plan.price }} €</span>
          <span>/ mois</span>
        </p>
        <p class="plan-card__description">{{ plan.description }}</p>
        <ul class="plan-card__benefits">
          @for (benefit of plan.benefits; track benefit) {
            <li>{{ benefit }}</li>
          }
        </ul>
        <button class="plan-card__button" type="button">M’abonner</button>
      </article>
    }
  </div>
</section>
