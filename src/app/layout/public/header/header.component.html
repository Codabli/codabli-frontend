<header class="header">
  <div class="header__grid grid grid--bleed">
    <div class="header__content">
      <button
        class="header__menu-button"
        type="button"
        aria-label="Ouvrir le menu"
      >
        <app-icon
          name="menu"
          [size]="24"
        />
      </button>

      <a
        class="header__brand"
        routerLink="/"
        aria-label="Retour à l'accueil"
        (click)="scrollToTop()"
      >
        <img
          class="header__logo"
          src="/assets/brand/logo.svg"
          alt=""
        />
      </a>

      <div class="header__search">
        <app-search-input />
      </div>

      <div class="header__actions">
        <div
          #languageSelector
          class="header__language"
        >
          <span class="header__language-code">
            {{ languageService.currentLanguage() }}
          </span>

          <button
            class="header__language-button"
            type="button"
            aria-label="Choisir la langue"
            aria-haspopup="menu"
            [attr.aria-expanded]="isLanguageMenuOpen()"
            (click)="toggleLanguageMenu()"
          >
            <app-icon
              name="arrow-down4"
              [size]="20"
            />
          </button>

          @if (isLanguageMenuOpen()) {
            <div
              class="header__language-menu"
              role="menu"
            >
              @for (item of languageService.languages; track item.code) {
                <button
                  class="header__language-option"
                  type="button"
                  role="menuitemradio"
                  [attr.aria-checked]="
                    languageService.currentLanguage() === item.code
                  "
                  [class.header__language-option--active]="
                    languageService.currentLanguage() === item.code
                  "
                  (click)="selectLanguage(item.code)"
                >
                  {{ item.label }}
                </button>
              }
            </div>
          }
        </div>

        @if (isAuthenticated()) {
          <button
            class="header__action"
            type="button"
            aria-label="Ouvrir le panier"
          >
            <app-icon
              name="shop"
              [size]="24"
            />
          </button>
          <div
            #profileSelector
            class="header__profile"
          >
            <button
              class="header__action"
              type="button"
              aria-label="Ouvrir mon profil"
              aria-haspopup="menu"
              [attr.aria-expanded]="isProfileMenuOpen()"
              (click)="toggleProfileMenu()"
            >
              <app-icon
                name="profile"
                [size]="24"
              />
            </button>
            @if (isProfileMenuOpen()) {
              <div
                class="header__profile-menu"
                role="menu"
              >
                <a
                  class="header__profile-option"
                  routerLink="/profile"
                  role="menuitem"
                  (click)="closeProfileMenu()"
                >
                  {{ 'header.profile' | translate }}
                </a>

                <button
                  class="header__profile-option header__profile-option--danger"
                  type="button"
                  role="menuitem"
                  (click)="logout()"
                >
                  {{ 'header.logout' | translate }}
                </button>
              </div>
            }
          </div>
        } @else {
          <app-button
            class="header__login"
            variant="outline"
            icon="login"
            aria-label="Se connecter"
            [routerLink]="'/login'"
          >
            {{ 'header.login' | translate }}
          </app-button>
        }
      </div>
    </div>
  </div>
  <app-navbar />
</header>
