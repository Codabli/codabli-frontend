<section class="contact-us">
  <div class="contact-us__content grid">
    <div class="contact-us__intro">
      <p class="contact-us__eyebrow">Contact</p>

      <h1>Parlons de ton prochain voyage.</h1>

      <p class="contact-us__text">
        Tu as une question, une idée de projet ou envie d’échanger sur les
        histoires à raconter ? Nous sommes là pour t’écouter et te guider.
      </p>

      <div class="contact-us__highlights">
        <article class="contact-us__highlight">
          <span class="contact-us__highlight-icon">
            <i class="fa-solid fa-envelope" aria-hidden="true"></i>
          </span>
          <div>
            <h2>Écris-nous</h2>
            <p>hello@codabli.fr</p>
          </div>
        </article>

        <article class="contact-us__highlight">
          <span class="contact-us__highlight-icon">
            <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
          </span>
          <div>
            <h2>Nous trouver</h2>
            <p>Paris, France</p>
          </div>
        </article>
      </div>
    </div>

    <div class="contact-us__card">
      <h2>Envoyer un message</h2>

      <form class="contact-us__form" (ngSubmit)="onSubmit()" #contactForm="ngForm">
        <label class="contact-us__field">
          <span>Nom</span>
          <input
            type="text"
            name="name"
            [(ngModel)]="contact.name"
            placeholder="Ton nom"
            required
          />
        </label>

        <label class="contact-us__field">
          <span>Email</span>
          <input
            type="email"
            name="email"
            [(ngModel)]="contact.email"
            placeholder="ton@email.com"
            required
          />
        </label>

        <label class="contact-us__field">
          <span>Sujet</span>
          <input
            type="text"
            name="subject"
            [(ngModel)]="contact.subject"
            placeholder="Objet de ton message"
            required
          />
        </label>

        <label class="contact-us__field contact-us__field--full">
          <span>Message</span>
          <textarea
            name="message"
            rows="5"
            [(ngModel)]="contact.message"
            placeholder="Décris ton besoin, ta demande ou ton idée..."
            required
          ></textarea>
        </label>

        <div class="contact-us__actions">
          <app-button variant="primary" type="submit">Envoyer</app-button>
        </div>
      </form>
    </div>
  </div>
</section>
