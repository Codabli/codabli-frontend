<div class="filter-select">
  <button
    type="button"
    class="filter-select__trigger"
    [attr.aria-expanded]="isOpen()"
    (click)="toggle()"
  >
    <span class="filter-select__placeholder">
      {{ placeholder() }}
    </span>

    <app-icon
      name="arrow-down4"
      [size]="16"
      class="filter-select__icon"
      [class.filter-select__icon--open]="isOpen()"
    />
  </button>

  @if (isOpen()) {
    <div class="filter-select__dropdown">
      @for (option of options(); track option.value) {
        <button
          type="button"
          class="filter-select__option"
        >
          {{ option.label }}
        </button>
      }
    </div>
  }
</div>
