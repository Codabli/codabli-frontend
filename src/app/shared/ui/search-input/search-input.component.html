<div class="search-input">
  <input
    class="search-input__field"
    type="search"
    placeholder="Rechercher..."
    aria-label="Rechercher"
  />

  <button
    class="search-input__button"
    type="button"
    aria-label="Lancer la recherche"
  >
    <app-icon
      name="search"
      [size]="24"
    />
  </button>
</div>
